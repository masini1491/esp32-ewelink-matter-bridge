name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build/host -DBRIDGE_BUILD_HOST_TESTS=ON
      - name: Build host tests
        run: cmake --build build/host
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure

  esp32c3-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5
      - name: Build constrained C3 compile probe
        run: |
          idf.py -C platform/esp32c3_probe set-target esp32c3
          idf.py -C platform/esp32c3_probe build
      - name: Capture compile evidence
        run: |
          mkdir -p evidence
          cp platform/esp32c3_probe/dependencies.lock evidence/
          cp platform/esp32c3_probe/sdkconfig evidence/
          cp platform/esp32c3_probe/partitions.csv evidence/partition-table-source.csv
          cp platform/esp32c3_probe/build/partition_table/partition-table.bin evidence/
          python3 "$IDF_PATH/components/partition_table/gen_esp32part.py" \
            --offset 0xC000 \
            --flash-size 4MB \
            platform/esp32c3_probe/build/partition_table/partition-table.bin \
            evidence/partition-table-resolved.csv
          cp platform/esp32c3_probe/build/esp32c3_compile_probe.bin evidence/
          idf.py -C platform/esp32c3_probe size > evidence/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: esp32c3-compile-evidence
          path: evidence
